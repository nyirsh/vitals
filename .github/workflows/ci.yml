# Every push and pull request: both consoles' builds, each in its SDK's Docker image, then the host
# tests. DOCKER= makes the Makefiles run their build commands right here, as CI is already in the image.
# On a push to main, once all of that passed, the release VERSION names is published when it isn't yet
# (shared/tools/release.py)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-psv:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Vita app and its modules
        run: make -C psv DOCKER='sh -lc'
      - uses: actions/upload-artifact@v4
        with:
          name: vitals-app-vpk
          path: psv/build/vitals-app/vitals-app.vpk
          retention-days: 7

  build-ps3:
    runs-on: ubuntu-latest
    container: nyirsh/vitals-ps3-sdk:latest
    steps:
      - uses: actions/checkout@v4
      # The PS3's builds expect the repository at /src, as the Makefile mounts it
      - name: Build the PS3 app and its modules, and the RPCS3 installers that carry them
        run: |
          ln -sfn "$PWD" /src
          make -C /src/ps3 DOCKER='bash -c' all build/ps3dk-include/cell/http.h
          make -C /src/rpcs3 DOCKER='bash -c'
      - uses: actions/upload-artifact@v4
        with:
          name: ps3dk-include
          path: ps3/build/ps3dk-include
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vitals-app-pkg
          path: ps3/build/vitals-app/vitals-app.pkg
          retention-days: 7
      # The RPCS3 installers (rpcs3/), each carrying the app's modules
      - uses: actions/upload-artifact@v4
        with:
          name: rpcs3-installers
          path: rpcs3/build/
          retention-days: 7

  # The host tests, each console's on its own; vitals-http's (both consoles') link this machine's
  # zlib, and the image only has the Vita's
  test-psv:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      # Three tries, as a runner's DNS can drop out for a minute (apt-get update only warns then)
      - name: Install zlib's headers
        run: for try in 1 2 3; do apt-get -o Acquire::Retries=3 update && apt-get install -y zlib1g-dev && break; [ $try = 3 ] && exit 1; sleep 20; done
      - name: Vita's host tests
        run: make -C psv test

  test-ps3:
    needs: build-ps3
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      # The PS3's tests read PS3DK's HTTP and SSL headers, which only its image has
      - uses: actions/download-artifact@v4
        with:
          name: ps3dk-include
          path: ps3/build/ps3dk-include
      # Three tries, as a runner's DNS can drop out for a minute (apt-get update only warns then)
      - name: Install zlib's headers
        run: for try in 1 2 3; do apt-get -o Acquire::Retries=3 update && apt-get install -y zlib1g-dev && break; [ $try = 3 ] && exit 1; sleep 20; done
      - name: PS3's host tests
        run: make -C ps3 test

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-psv, build-ps3, test-psv, test-ps3]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two pushes to main in a row never publish at once
    concurrency: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vitals-app-vpk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: vitals-app-pkg
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: rpcs3-installers
          path: dist
      - name: Tag and release VERSION, when it isn't yet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 shared/tools/release.py github dist/vitals-app.vpk dist/vitals-app.pkg
          dist/linux-rpcs3-install.sh dist/macos-rpcs3-install.sh dist/windows-rpcs3-install.bat
